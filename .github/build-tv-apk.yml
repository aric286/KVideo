name: Build KVideo TV APK
on:
  workflow_dispatch: #手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: List android-tv folder
        run: ls -la android-tv

      - name: Grant gradlew execute permission
        run: chmod +x android-tv/gradlew

      - name: Build debug APK
        run: cd android-tv && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvideo-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
